<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28">

<style>

.line{
stroke:#6F6A61;
stroke-width:1;
opacity:.5;
}

.dot{
fill:#D8D3C7;
animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
0%,100%{
opacity:.3;
}
50%{
opacity:1;
}
}

</style>

<line class="line" x1="0" y1="14" x2="560" y2="14"/>
<circle class="dot" cx="600" cy="14" r="2.5"/>
<line class="line" x1="640" y1="14" x2="1200" y2="14"/>

</svg>